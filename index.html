async function decryptPayload(b64s,pw){
  const raw=Uint8Array.from(atob(b64s),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return new TextDecoder().decode(pt);
}

document.getElementById('f').onsubmit=async ev=>{
  ev.preventDefault();
  const e=document.getElementById('e');e.textContent='Vérification…';
  try{
    const html=await decryptPayload(PAYLOAD,document.getElementById('pw').value);
    document.open();document.write(html);document.close();
  }catch(_){e.textContent='Mot de passe incorrect';}
};
